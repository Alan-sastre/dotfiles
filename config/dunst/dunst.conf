# See dunst(5) for all configuration options

[global]
monitor = 0
follow = mouse
enable_posix_regex = true

### Geometry ###
width = 340
origin = top-right
offset = (16,16)
scale = 0
notification_limit = 5

### Progress bar ###
progress_bar = true
progress_bar_height = 6
progress_bar_frame_width = 0
progress_bar_min_width = 150
progress_bar_max_width = 280
progress_bar_corner_radius = 6

### Look ###
transparency = 35
corner_radius = 12
frame_width = 1
gap_size = 6
padding = 12
horizontal_padding = 12

### Text ###
format = "<b>%s</b>\n<small>%b</small>"
font = Mononoki Nerd Font Mono 9
line_height = 2
### Icons ###
enable_recursive_icon_lookup = true
icon_position = left
min_icon_size = 48
max_icon_size = 64

### History ###
sticky_history = yes
history_length = 20

### Misc ###
browser = /usr/bin/xdg-open
always_run_script = true
title = Dunst
class = Dunst
ignore_dbusclose = false
force_xwayland = false
force_xinerama = false
dmenu = /usr/bin/rofi -config notification -dmenu -p dunst:
sort = yes

### Mouse ###
mouse_left_click = close_current
mouse_middle_click = do_action
mouse_right_click = close_all

[experimental]
per_monitor_dpi = true

### App rules ###
[slack]
desktop_entry = "^Slack$"
new_icon = slack

[telegram]
desktop_entry = "^Telegram Desktop$"
new_icon = telegram-desktop

[skype]
desktop_entry = "^Skype$"
new_icon = skype
[urgency_low]
background = "#0d0d0dE6"
foreground = "#a0a0a0"
frame_color = "#1a1a1a"
timeout = 4

[urgency_normal]
background = "#0d0d0dE6"
foreground = "#e0e0e0"
frame_color = "#222222"
timeout = 6

[urgency_critical]
background = "#0d0d0dE6"
foreground = "#ff5555"
frame_color = "#ff3333"
timeout = 0